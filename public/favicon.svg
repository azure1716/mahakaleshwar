<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D0B13"/>
      <stop offset="100%" stop-color="#1A0206"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8B3"/>
      <stop offset="40%" stop-color="#D9A954"/>
      <stop offset="100%" stop-color="#9C732B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 2.5"/>

  <!-- Sacred OM Symbol -->
  <text 
    x="32" 
    y="42" 
    font-family="Georgia, serif" 
    font-size="32" 
    font-weight="bold" 
    fill="url(#goldGrad)" 
    text-anchor="middle"
    filter="url(#goldGlow)"
  >ॐ</text>
</svg>
